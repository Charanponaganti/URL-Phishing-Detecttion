# PhishGuard — Render Blueprint (Infrastructure as Code)
# Deploys both the FastAPI backend and React dashboard

services:
  # ── FastAPI Backend (Web Service) ──────────────────────────
  - type: web
    name: phishguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: URLHAUS_ENABLED
        value: "true"
      - key: DEBUG
        value: "false"

  # ── React Dashboard (Static Site) ──────────────────────────
  - type: web
    name: phishguard-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
